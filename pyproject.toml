[project]
name = "circulax"
dynamic = ["version"]
description = "Differentiable circuit simulator based on JAX"
authors = [
    { name = "Chris Daunt", email = "chris.ll.m.daunt@gmail.com" }
]
readme = "ReadMe.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = ["jax", "differentiable", "circuit", "simulation", "photonics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.2.0,<3.0.0",
    # Lower bound 0.7.2: equinox/optimistix exclude 0.7.0/0.7.1.
    # Upper bound <0.10.0: from sax. The old <0.8 cap was a leftover from
    # klujax 0.4.x (which used jax.pmap); klujax 0.5.0 dropped pmap.
    # Note: the verilog-a extra (bosdi) further constrains jax to <0.8.
    "jax>=0.7.2,<0.10.0",
    "diffrax>=0.7.0,<0.8",
    "sax>=0.17,<0.19",
    "matplotlib>=3.9,<4.0.0",
    "typing-extensions>=4.13.2,<5.0.0",
    "lineax>=0.1.0,<0.2",
    "equinox>=0.13,<0.15",
    "optimistix>=0.1.0,<0.2",
    "klujax>=0.5.0,<0.6.0",
    "kfnetlist>=0.2.0,<0.3",
]

[project.optional-dependencies]
# bosdi caps jax<0.8, so the verilog-a extra constrains the core down from
# jax<0.10.0 to jax<0.8 (i.e. jax 0.7.2). The dev/default env pulls verilog-a,
# so it stays on jax 0.7.2 until bosdi widens its compatibility.
verilog-a = [
    "bosdi>=0.1.5,<0.2",
]
docs = [
    "ipykernel>=6.29.5",
    "nbconvert",
    "papermill",
    "hippogriffe==0.2.2",
    "mkdocs==1.6.1",
    "mkdocs-include-exclude-files==0.1.0",
    "mkdocs-material==9.6.7",
    "mkdocstrings==0.28.3",
    "mkdocstrings-python==1.16.8",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "pymdown-extensions",
    "mkdocs_matplotlib",
    "mkautodoc>=0.2.0",
    "mkdocs-autorefs>=1.3.0",
    "mkdocs-bibtex>=4.4.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-minify-plugin>=0.8.0",
    "jupyter-dash",
    "kaleido>=1.2.0,<2",
]
dev = [
    "circulax[docs, verilog-a]",
    "black",
    "ruff",
    "pytest>=8",
    "pytest-xdist",
    "mypy",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/gdsfactory/circulax"
Repository = "https://github.com/gdsfactory/circulax"
Documentation = "https://gdsfactory.github.io/circulax"
Issues = "https://github.com/gdsfactory/circulax/issues"

# ---------------------------------------------------------------------------
# Build system (PyPI / hatch)
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "circulax/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["circulax"]

# ---------------------------------------------------------------------------
# Pixi workspace
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64","osx-arm64","win-64"]
# pixi-build is still preview-gated
preview = ["pixi-build"]

# Shared editable install for all environments
[tool.pixi.pypi-dependencies]
circulax = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# Conda package build (pixi build)
# pixi-build-python reads [project] metadata directly — no recipe.yaml needed.
# ---------------------------------------------------------------------------

[tool.pixi.package]
name = "circulax"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

# ---------------------------------------------------------------------------
# Features — one per Python version
# ---------------------------------------------------------------------------

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
tqdm = ">=4.67.1,<5"

# Test feature — lean CI environment (no docs, no dev tooling)
# Used for the non-default Python matrix (py312).
# bosdi (verilog-a extra) has no Windows wheels, so Windows uses base deps only.
[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=8"
pytest-xdist = "*"

[tool.pixi.feature.test.target.linux-64.pypi-dependencies]
circulax = { path = ".", editable = true, extras = ["verilog-a"] }

[tool.pixi.feature.test.target.osx-arm64.pypi-dependencies]
circulax = { path = ".", editable = true, extras = ["verilog-a"] }

[tool.pixi.feature.test.target.win-64.pypi-dependencies]
circulax = { path = ".", editable = true }

# Dev tooling feature — full local development environment
# Includes git-cliff (changelog), uv (build), and the docs/papermill extras.
[tool.pixi.feature.dev.pypi-dependencies]
circulax = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.feature.dev.dependencies]
tqdm = ">=4.67.1,<5"
uv = ">=0.6"
git-cliff = ">=2"
schemdraw = ">=0.18"

# Benchmark feature — NGSpice accuracy comparison
[tool.pixi.feature.benchmark.dependencies]
scipy = ">=1.13"
matplotlib = ">=3.9"
tqdm = ">=4.67"

# NGSpice is linux-64 only (no osx-arm64 conda package)
[tool.pixi.feature.benchmark.target.linux-64.dependencies]
ngspice = "*"

[tool.pixi.feature.benchmark.pypi-dependencies]
circulax = { path = ".", editable = true, extras = ["verilog-a"] }


# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

[tool.pixi.tasks]
copy_readme      = { cmd = ["python", "scripts/copy_readme.py"],   description = "Copy README into docs/ and strip docs/ prefixes" }
install_ipkernel = "python -m ipykernel install --user --name circulax"
nbrun            = { cmd = ["python", "scripts/run_notebooks.py"], depends-on = ["install_ipkernel", "compile_osdi"], description = "Execute all notebooks in-place with papermill" }
nbdocs           = { cmd = ["python", "scripts/build_docs.py"],    depends-on = ["copy_readme"], description = "Convert executed notebooks to Markdown in docs/examples/" }
docs-serve       = { cmd = ["mkdocs", "serve", "-w", "docs"], depends-on = ["copy_readme"] }
docs-deploy      = { cmd = ["mkdocs", "gh-deploy", "--force"], depends-on = ["copy_readme"] }
compile_osdi     = { cmd = ["python", "scripts/compile_osdi.py"], description = "Compile VA test fixtures to OSDI using openvaf-r (--target-cpu generic). Manual/LGPL-gated: never a dependency of build/build-conda." }
pytest_run       = { cmd = ["pytest", "tests", "-m", "not long"], description = "Fast tests only — skips @pytest.mark.long (notebook execution)" }
pytest_all       = { cmd = ["pytest", "tests", "-m", "long or not long"], depends-on = ["install_ipkernel", "compile_osdi"], description = "All tests including @pytest.mark.long (notebook execution)" }
lint_format      = "ruff format"
lint_check       = "ruff -v check"
build            = { cmd = "uv build", description = "Build sdist and wheel into dist/" }
build-wheel      = { cmd = "uv build --wheel", description = "Build wheel only" }
build-sdist      = { cmd = "uv build --sdist", description = "Build sdist only" }
build-conda      = { cmd = "pixi build", description = "Build conda package" }
clean-dist       = { cmd = ["python", "scripts/clean_dist.py"],    description = "Remove build artefacts" }
changelog        = { cmd = "git cliff --output CHANGELOG.md", description = "Regenerate full CHANGELOG.md from git history" }
changelog-unreleased = { cmd = "git cliff --unreleased", description = "Preview changelog entries since the last tag" }
bench_list       = { cmd = ["python", "benchmarks/run.py", "list"],                 description = "List benchmark cases" }
bench_release    = { cmd = ["python", "benchmarks/run.py", "run", "release"],       description = "Run release benchmark suite" }
bench_rc         = { cmd = ["python", "benchmarks/run.py", "run", "rc"],            description = "VACASK/ngspice/Circulax RC benchmark" }
bench_ring       = { cmd = ["python", "benchmarks/run.py", "run", "ring"],          description = "PSP103 OSDI ring benchmark" }
bench_cascade    = { cmd = ["python", "benchmarks/run.py", "run", "legacy-diode-cascade"], description = "Legacy diode cascade testbench" }
bench_rectifier  = { cmd = ["python", "benchmarks/run.py", "run", "legacy-rectifier"],      description = "Legacy full-wave rectifier testbench" }
bench_lc_ladder  = { cmd = ["python", "benchmarks/run.py", "run", "legacy-lc-ladder"],      description = "Legacy LC ladder scalability testbench" }

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------

[tool.pixi.environments]
default = { features = ["py313", "dev"], solve-group = "py313" }

# CI matrix: non-default Pythons use the lean 'test' feature (no dev tooling,
# no docs/papermill) so the matrix solves quickly and only tests core behaviour.
py312 = { features = ["py312", "test"], solve-group = "py312" }
py313 = { features = ["py313", "dev"],  solve-group = "py313" }

# Benchmark environment — includes NGSpice for accuracy comparisons
benchmark = { features = ["py313", "benchmark"], solve-group = "py313" }

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# `long` marks slow tests (e.g. notebook execution) that are skipped by default.
# Run them explicitly via `pixi run pytest_all` or
# `pytest -m "long or not long"`.
markers = [
    "long: slow tests (e.g. notebook execution); excluded from the default run",
]
addopts = "-m 'not long'"
filterwarnings = [
    "ignore::numpy.exceptions.ComplexWarning",
    "ignore:Complex dtype support in Diffrax:UserWarning",
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:papermill",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
fix = true
target-version = "py312"
line-length = 132

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]  # see https://docs.astral.sh/ruff/rules
ignore = [
    "COM812",   # missing-trailing-comma
    "D401",     # imperative-mood
    "D105",     # undocumented-magic-method
    "D203",     # incorrect-blank-line-before-class
    "D213",     # multi-line-summary-second-line
    "E741",     # ambiguous-variable-name
    "ERA001",   # commented-out-code
    "FIX001",   # line-contains-fixme
    "FIX002",   # line-contains-todo
    "FIX004",   # line-contains-hack
    "N803",     # invalid-argument-name
    "N806",     # non-lowercase-variable-in-function
    "PD901",    # pandas-df-variable-name
    "PLC0414",  # useless-import-alias
    "PLC0415",  # import-outside-top-level
    "PLR0913",  # too-many-arguments
    "PLR2004",  # magic-value-comparison
    "PLW2901",  # redefined-loop-name
    "RET504",   # unnecessary-assign
    "RUF002",   # ambiguous-unicode-character-docstring
    "S324",     # hashlib-insecure-hash-function
    "TC001",    # typing-only-first-party-import
    "TC002",    # typing-only-third-party-import
    "TC003",    # typing-only-standard-library-import
    "TC006",    # runtime-cast-value
    "TD001",    # invalid-todo-tag
    "TD002",    # missing-todo-author
    "TD003",    # missing-todo-link
    "TID252",   # relative-imports
    "TRY003",   # raise-vanilla-args
    "UP013",    # convert-typed-dict-functional-to-class
    "ANN401",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "ANN",      # flake8-annotations
    "ARG001",   # unused-function-argument
    "D",        # pydocstyle
    "E402",     # module-import-not-at-top-of-file
    "E501",     # line-too-long
    "F821",     # undefined-name
    "FBT003",   # boolean-positional-value-in-call
    "N816",     # mixed-case-variable-in-global-scope
    "PLC2401",  # non-ascii-name
    "S101",     # assert
    "SLF001",   # private-member-access
    "T201",     # print
]
"docs/hooks.py" = [
    "INP001",   # implicit-namespace-package
    "ARG001",   # unused-function-argument
    "ANN401",   # any-type
    "FBT001",   # boolean-type-hint-positional-argument
]
"tests/*" = [
    "D",        # pydocstyle
    "INP001",   # implicit-namespace-package
    "PT011",    # pytest-raises-too-broad
    "S101",     # assert
    "T201",     # print
]
"circulax/components/*.py" = [
    "N802",
    "ARG001",
]
